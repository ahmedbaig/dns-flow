server {
    listen 443 ssl;
    http2 on;
    server_name flow.example.net;
    ssl_certificate     /etc/nginx/ssl/example.crt;
    ssl_certificate_key /etc/nginx/ssl/example.key;

    # Optional: an oauth2-proxy auth_request snippet. The bridge records the
    # signed-in user from X-Auth-Request-Email in its audit table.
    # include /etc/nginx/snippets/sso-auth.conf;

    location / {
        proxy_pass http://10.10.20.6:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header X-Auth-Request-Email $sso_email;

        # The live map is a Server-Sent Events stream: never buffer it.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
